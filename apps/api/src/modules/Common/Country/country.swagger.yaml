paths:
  /country:
    get:
      tags:
        - Country
      summary: Get a list of countries
      description: Returns a list of available countries with optional search by name or code.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search term to filter countries by name or code
          example: "United"
      responses:
        '200':
          description: A list of countries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                      description: Country code (e.g., US, IN, GB)
                      example: US
                    name:
                      type: string
                      description: Full country name
                      example: United States
        '500':
          description: Internal server error fetching countries
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to fetch country list
