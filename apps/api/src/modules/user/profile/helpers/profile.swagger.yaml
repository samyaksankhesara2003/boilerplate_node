paths:
  /user/profile:
    get:
      tags:
        - Profile
      summary: Get user profile
      description: Returns the profile details of the currently authenticated user.
      parameters:
        - name: Accept-Language
          in: header
          required: true
          schema:
            type: string
            enum: [en, fr]
            default: en
          description: Language code for localized responses (default is en)
      responses:
        "200":
          description: Successfully fetched user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                    example: 1
                  first_name:
                    type: string
                    example: John
                  last_name:
                    type: string
                    example: Doe
                  email:
                    type: string
                    example: john@example.com
                  profile_url:
                    type: string
                    example: https://example.com/profile.jpg
                  role:
                    type: number
                    example: 2
                  status:
                    type: number
                    example: 1
        "401":
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Unauthorized

    patch:
      tags:
        - Profile
      summary: Update user profile
      description: Updates the profile information of the authenticated user.
      parameters:
        - name: Accept-Language
          in: header
          required: true
          schema:
            type: string
            enum: [en, fr]
            default: en
          description: Language code for localized responses (default is en)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                  example: John
                last_name:
                  type: string
                  example: Doe
                profile_image:
                  type: string
                  format: binary
                  description: Profile image file to upload
      responses:
        "200":
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                    example: 1
                  first_name:
                    type: string
                    example: John
                  last_name:
                    type: string
                    example: Doe
                  email:
                    type: string
                    example: john@example.com
                  profile_url:
                    type: string
                    example: https://example.com/profile.jpg
                  role:
                    type: number
                    example: 2
                  status:
                    type: number
                    example: 1
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid input data
        "401":
          description: Unauthorized - Invalid or missing token

  /user/profile/password:
    patch:
      tags:
        - Profile
      summary: Change user password
      description: Allows the authenticated user to change their password.
      parameters:
        - name: Accept-Language
          in: header
          required: true
          schema:
            type: string
            enum: [en, fr]
            default: en
          description: Language code for localized responses (default is en)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  example: OldPass123
                new_password:
                  type: string
                  example: NewSecurePass456
              required:
                - current_password
                - new_password
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password updated successfully
        "400":
          description: Invalid current password or validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Current password is incorrect
        "401":
          description: Unauthorized - Invalid or missing token
