paths:
  /experience-booking/{experience_booking_id}:
    get:
      tags:
        - Experience Booking
      summary: Get an experience booking by ID
      description: Get an experience booking
      parameters:
        - name: experience_booking_id
          in: path
          required: true
          schema:
            type: number
          description: Experience booking ID
          example: 1
      responses:
        '200':
          description: Experience booking details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                    example: 1
                  user_id:
                    type: number
                    example: 1
                  experience_id:
                    type: number
                    example: 1
                  experience_price_id:
                    type: number
                    example: 1
                  guests:
                    type: number
                    example: 2
                  total_price:
                    type: number
                    example: 100.0
                  service_fee:
                    type: number
                    example: 10.0
                  total_amount:
                    type: number
                    example: 110.0
                  status:
                    type: string
                    enum:
                      - 1
                      - 2
                      - 3
                    description: Booking status 1 -> Pending, 2 -> Accepted, 3 -> Rejected
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to get experience booking details

  /experience-booking:
    get:
      tags:
        - Experience Booking
      summary: List all experience bookings
      description: List all experience bookings
      parameters:
        - name: experience_id
          in: query
          required: false
          schema:
            type: number
          description: Experience ID
          example: 1
        - name: experience_booking_id
          in: query
          required: false
          schema:
            type: number
          description: Experience booking ID
          example: 1
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - 1
              - 2
              - 3
          description: Booking status 1 -> Pending, 2 -> Accepted, 3 -> Rejected
          example: 1
      responses:
        '200':
          description: List of experiences
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: number
                      example: 1
                    user_id:
                      type: number
                      example: 1
                    experience_id:
                      type: number
                      example: 1
                    experience_price_id:
                      type: number
                      example: 1
                    guests:
                      type: number
                      example: 1
                    total_price:
                      type: number
                      example: 100.0
                    service_fee:
                      type: number
                      example: 10.0
                    total_amount:
                      type: number
                      example: 110.0
                    status:
                      type: string
                      enum:
                        - 1
                        - 2
                        - 3
                      description: Booking status 1 -> Pending, 2 -> Accepted, 3 -> Rejected
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to list experience bookings
  
  /experience-booking/{experience_id}:
    post:
      tags:
        - Experience Booking
      summary: Book an experience by ID
      description: Book an experience
      parameters:
        - name: experience_id
          in: path
          required: true
          schema:
            type: number
          description: Experience ID
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                experience_price_id:
                  type: number
                  example: 1
                guest_count:
                  type: number
                  example: 2
                total_price:
                  type: number
                  example: 100.0
                service_fee:
                  type: number
                  example: 10.0
                total_amount:
                  type: number
                  example: 110.0
      responses:
        '200':
          description: Experience booked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                    example: 1
                  user_id:
                    type: number
                    example: 1
                  experience_id:
                    type: number
                    example: 1
                  experience_price_id:
                    type: number
                    example: 1
                  guests:
                    type: number
                    example: 1
                  total_price:
                    type: number
                    example: 100.0
                  service_fee:
                    type: number
                    example: 10.0
                  total_amount:
                    type: number
                    example: 110.0
                  status:
                    type: string
                    example: Pending
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to book experience
