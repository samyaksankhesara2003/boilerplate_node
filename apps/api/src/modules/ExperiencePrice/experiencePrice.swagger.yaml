paths:
  /experience-price/{experience_id}:
    get:
      tags:
        - Experience Price
      summary: Get a list of prices for an experience
      description: Returns a list of price options associated with a specific experience.
      parameters:
        - name: Accept-Language
          in: header
          required: true
          schema:
            type: string
            enum: [en, fr]
            default: en
          description: Language code for localized responses (default is en)
        - name: experience_id
          in: path
          required: true
          schema:
            type: number
          description: ID of the experience to fetch prices for
          example: 1
      responses:
        '200':
          description: A list of experience prices
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Unique ID of the price entry
                      example: "price-001"
                    experience_id:
                      type: string
                      description: Related experience ID
                      example: "exp-001"
                    title:
                      type: string
                      description: Name of the price tier or option
                      example: "Standard Package"
                    price:
                      type: number
                      format: float
                      description: Price for the option
                      example: 149.99
                    currency:
                      type: string
                      description: Currency code
                      example: "USD"
        '400':
          description: Missing or invalid experience_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: experience_id is required
        '500':
          description: Internal server error fetching experience prices
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to fetch experience prices
