paths:
  /experience-schedule/{experience_id}:
    get:
      tags:
        - Experience Schedule
      summary: Get a list of experience schedules
      description: Returns a list of schedules associated with a specific experience.
      parameters:
        - name: Accept-Language
          in: header
          required: true
          schema:
            type: string
            enum: [en, fr]
            default: en
          description: Language code for localized responses (default is "en")
        - name: experience_id
          in: path
          required: true
          schema:
            type: number
          description: ID of the experience to fetch schedules for
          example: 1
      responses:
        '200':
          description: A list of experience schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Unique ID of the schedule
                      example: "sch-001"
                    experience_id:
                      type: string
                      description: ID of the related experience
                      example: "exp-001"
                    date:
                      type: string
                      format: date
                      description: Scheduled date of the experience
                      example: "2025-05-10"
                    time:
                      type: string
                      format: time
                      description: Scheduled time of the experience
                      example: "10:30:00"
        '400':
          description: Missing or invalid experience_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: experience_id is required
        '500':
          description: Internal server error fetching schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to fetch experience schedules
