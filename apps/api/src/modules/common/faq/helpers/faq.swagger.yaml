paths:
  /common/faq/{id}:
    get:
      tags:
        - FAQ
      summary: Get a single FAQ by ID
      description: Returns details of a specific FAQ by its ID.
      parameters:
        - name: id
          in: path
          required: false
          schema:
            type: number
          description: ID of the FAQ to retrieve
          example: 1
      responses:
        "200":
          description: A single FAQ
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                    description: FAQ ID
                    example: 1
                  question:
                    type: string
                    description: Question
                    example: What is the capital of France?
                  answer:
                    type: string
                    description: Answer
                    example: Paris
        "500":
          description: Internal server error fetching FAQ
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to fetch FAQ
    delete:
      tags:
        - FAQ
      summary: Delete a FAQ by ID
      description: Deletes a FAQ by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
          description: ID of the FAQ to delete
          example: 1
      responses:
        "200":
          description: FAQ deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: FAQ deleted successfully
        "500":
          description: Internal server error deleting FAQ
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to delete FAQ

  /common/faq:
    get:
      tags:
        - FAQ
      summary: Get a list of FAQs
      description: Returns a list of available FAQs with optional search by question or answer.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search term to filter FAQs by question or answer
          example: "United"
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Status of the FAQ
          example: "active"
        - name: perPage
          in: query
          required: false
          schema:
            type: number
          description: Number of records per page
          example: 10
        - name: page
          in: query
          required: false
          schema:
            type: number
          description: Page number
          example: 1
        - name: orderBy
          in: query
          required: false
          schema:
            type: string
          description: Order by field
          example: "created_at"
        - name: orderDir
          in: query
          required: false
          schema:
            type: string
          description: Order direction
          example: "asc"
      responses:
        "200":
          description: A list of FAQs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: number
                      description: FAQ ID
                      example: 1
                    question:
                      type: string
                      description: Question
                      example: What is the capital of France?
                    answer:
                      type: string
                      description: Answer
                      example: Paris
        "500":
          description: Internal server error fetching FAQs
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to fetch FAQ list
    post:
      tags:
        - FAQ
      summary: Create a new FAQ
      description: Creates a new FAQ with a question and answer.
      parameters:
        - name: question
          in: body
          required: true
          schema:
            type: string
          description: Question
          example: What is the capital of France?
        - name: answer
          in: body
          required: true
          schema:
            type: string
          description: Answer
          example: Paris
      responses:
        "201":
          description: FAQ created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                    description: FAQ ID
                    example: 1
        "500":
          description: Internal server error creating FAQ
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to create FAQ
    put:
      tags:
        - FAQ
      summary: Update a FAQ by ID
      description: Updates a FAQ with a question and answer by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
          description: ID of the FAQ to update
          example: 1
        - name: question
          in: body
          required: true
          schema:
            type: string
          description: Question
          example: What is the capital of France?
        - name: answer
          in: body
          required: true
          schema:
            type: string
          description: Answer
          example: Paris
      responses:
        "200":
          description: FAQ updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                  question:
                    type: string
                  answer:
                    type: string
        "500":
          description: Internal server error updating FAQ
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
