paths:
  /experience-category/{experience_category_id}:
    get:
      tags:
        - Experience Category
      summary: Get a single experience category
      description: Returns a single experience category by ID.
      parameters:
        - name: Accept-Language
          in: header
          required: true
          schema:
            type: string
            enum: [en, fr]
            default: en
          description: Language code for localized responses (default is "en")
        - name: experience_category_id
          in: path
          required: true
          schema:
            type: number
          description: ID of the experience category to retrieve
          example: 1
      responses:
        '200':
          description: A single experience category
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                    description: Unique ID of the experience category
                    example: 1
                  name:
                    type: string
                    description: Name of the experience category
                    example: "Adventure"
                  status:
                    type: integer
                    description: Status of the experience category
                    enum:
                      - 1
                      - 2
                    example: 1
        '500':
          description: Internal server error fetching experience categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to fetch experience categories

  /experience-category:
    get:
      tags:
        - Experience Category
      summary: Get a list of experience categories
      description: Returns a list of experience categories with an optional search filter.
      parameters:
        - name: Accept-Language
          in: header
          required: true
          schema:
            type: string
            enum: [en, fr]
            default: en
          description: Language code for localized responses (default is "en")
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search term to filter categories by name or code
          example: "Adventure"
      responses:
        '200':
          description: A list of experience categories
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: number
                      description: Unique ID of the experience category
                      example: 1
                    name:
                      type: string
                      description: Name of the experience category
                      example: "Adventure"
                    status:
                      type: integer
                      description: Status of the experience category
                      enum:
                        - 1
                        - 2
                      example: 1
        '500':
          description: Internal server error fetching experience categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Failed to fetch experience categories
